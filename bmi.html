<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Survey - SDG 15</title>

    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: url('https://miro.medium.com/v2/resize:fit:720/format:webp/1*jnsH3fTas6CL5EPc2HsJsg.png') no-repeat center center/cover;
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
            position: relative;
        }
        /* Overlay */
        
        .overlay {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(3px);
            position: absolute;
            inset: 0;
            z-index: 0;
        }
        
        header {
            position: relative;
            text-align: center;
            padding: 80px 20px;
            z-index: 2;
        }
        
        h1 {
            font-size: 3rem;
            text-shadow: 0 0 25px #91ff9d;
        }
        
        nav {
            margin-top: 20px;
        }
        
        nav a {
            color: #ffffff;
            padding: 12px 25px;
            text-decoration: none;
            border: 2px solid #c8ffc8;
            border-radius: 8px;
            margin: 0 10px;
            transition: 0.3s;
        }
        
        nav a:hover {
            background: #b5ffb5;
            color: #000;
            box-shadow: 0 0 20px #8cff8c;
        }
        
        section {
            position: relative;
            z-index: 2;
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 10px;
            text-align: center;
        }
        
        input,
        button {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
        }
        
        button {
            background: #2ecc71;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        
        button:hover {
            background: #27ae60;
        }
        
        #result {
            margin-top: 20px;
            padding: 15px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 10px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.6s ease, transform 0.6s ease;
            transform: translateY(20px);
        }
        
        #result.show {
            opacity: 1;
            transform: translateY(0);
        }
        /* Floating particles */
        
        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #aaffaa;
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
            opacity: 0.8;
            z-index: 1;
        }
        
        @keyframes float {
            0% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-60px) scale(1.3);
            }
            100% {
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="overlay"></div>

    <!-- Floating particles -->
    <div class="particle" style="top: 85%; left: 20%; animation-delay: 0s;"></div>
    <div class="particle" style="top: 60%; left: 50%; animation-delay: 1s;"></div>
    <div class="particle" style="top: 70%; left: 80%; animation-delay: 2s;"></div>
    <div class="particle" style="top: 40%; left: 30%; animation-delay: 3s;"></div>
    <div class="particle" style="top: 50%; left: 10%; animation-delay: 4s;"></div>

    <header data-aos="fade-down">
        <h1>BMI Survey</h1>
        <nav data-aos="zoom-in" data-aos-delay="300">
            <a href="index.html">Home</a>
            <a href="about-us.html">About Us</a>
            <a href="bmi.html">BMI Survey</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <section data-aos="fade-up" data-aos-delay="500">
        <h2>Calculate Your BMI</h2>
        <form id="bmiForm">
            <input type="number" id="weight" placeholder="Weight (kg)" required>
            <input type="number" id="height" placeholder="Height (cm)" required>
            <button type="submit">Calculate</button>
        </form>

        <div id="result"></div>
    </section>

    <script>
        const form = document.getElementById('bmiForm');
        const result = document.getElementById('result');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value) / 100;
            const bmi = (weight / (height * height)).toFixed(2);

            let category = '';
            let color = '';
            if (bmi < 18.5) {
                category = 'Underweight';
                color = '#3498db';
            } else if (bmi < 24.9) {
                category = 'Normal weight';
                color = '#2ecc71';
            } else if (bmi < 29.9) {
                category = 'Overweight';
                color = '#f1c40f';
            } else {
                category = 'Obese';
                color = '#e74c3c';
            }

            result.innerHTML = `Your BMI: ${bmi} <br>Category: ${category}`;
            result.style.backgroundColor = color;
            result.classList.add('show');

            // Save to localStorage for Dashboard
            let history = JSON.parse(localStorage.getItem('bmiHistory') || '[]');
            history.push({
                date: new Date().toLocaleDateString(),
                bmi,
                category
            });
            localStorage.setItem('bmiHistory', JSON.stringify(history));
        });
    </script>

    <!-- AOS Library -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 1000,
            once: true
        });
    </script>

</body>

</html>
