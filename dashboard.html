<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SDG 15 Life on Land</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: url('https://miro.medium.com/v2/resize:fit:720/format:webp/1*jnsH3fTas6CL5EPc2HsJsg.png') no-repeat center center/cover;
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
            position: relative;
        }
        
        .overlay {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(3px);
            position: absolute;
            inset: 0;
            z-index: 0;
        }
        
        header {
            position: relative;
            text-align: center;
            padding: 80px 20px;
            z-index: 2;
        }
        
        h1 {
            font-size: 3rem;
            text-shadow: 0 0 25px #91ff9d;
        }
        
        nav {
            margin-top: 20px;
        }
        
        nav a {
            color: #ffffff;
            padding: 12px 25px;
            text-decoration: none;
            border: 2px solid #c8ffc8;
            border-radius: 8px;
            margin: 0 10px;
            transition: 0.3s;
        }
        
        nav a:hover {
            background: #b5ffb5;
            color: #000;
            box-shadow: 0 0 20px #8cff8c;
        }
        
        section.dashboard {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 10px;
            text-align: center;
        }
        
        canvas {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        table,
        th,
        td {
            border: 1px solid #2ecc71;
        }
        
        th,
        td {
            padding: 10px;
            text-align: center;
        }
        /* Floating particles */
        
        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #aaffaa;
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
            opacity: 0.8;
            z-index: 1;
        }
        
        @keyframes float {
            0% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-60px) scale(1.3);
            }
            100% {
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="overlay"></div>

    <!-- Floating particles -->
    <div class="particle" style="top: 85%; left: 20%; animation-delay: 0s;"></div>
    <div class="particle" style="top: 60%; left: 50%; animation-delay: 1s;"></div>
    <div class="particle" style="top: 70%; left: 80%; animation-delay: 2s;"></div>
    <div class="particle" style="top: 40%; left: 30%; animation-delay: 3s;"></div>
    <div class="particle" style="top: 50%; left: 10%; animation-delay: 4s;"></div>

    <header data-aos="fade-down">
        <h1>Progress Dashboard</h1>
        <nav data-aos="zoom-in" data-aos-delay="300">
            <a href="index.html">Home</a>
            <a href="about-us.html">About Us</a>
            <a href="bmi.html">BMI Survey</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <section class="dashboard" data-aos="fade-up" data-aos-delay="500">
        <h2>Combined Progress Tracker</h2>
        <canvas id="combinedChart" width="600" height="300"></canvas>

        <!-- Optional BMI History Table -->
        <h3>BMI History</h3>
        <table id="bmiTable">
            <tr>
                <th>Date</th>
                <th>BMI</th>
                <th>Category</th>
            </tr>
        </table>
    </section>

    <script>
        // Fetch stored data
        const bmiHistory = JSON.parse(localStorage.getItem('bmiHistory') || '[]');
        const ecoHistory = JSON.parse(localStorage.getItem('ecoHistory') || '[]');

        // Populate table
        const table = document.getElementById('bmiTable');
        bmiHistory.forEach(entry => {
            const row = table.insertRow();
            row.insertCell(0).innerText = entry.date;
            row.insertCell(1).innerText = entry.bmi;
            row.insertCell(2).innerText = entry.category;
        });

        // Prepare chart data
        const labels = bmiHistory.map(entry => entry.date);
        const bmiData = bmiHistory.map(entry => parseFloat(entry.bmi));
        const ecoCountByDate = labels.map(date => ecoHistory.filter(e => e.date === date).length);

        const ctx = document.getElementById('combinedChart').getContext('2d');

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    type: 'line',
                    label: 'BMI',
                    data: bmiData,
                    borderColor: '#2ecc71',
                    backgroundColor: 'transparent',
                    yAxisID: 'y1',
                    tension: 0.3
                }, {
                    type: 'bar',
                    label: 'Eco Actions',
                    data: ecoCountByDate,
                    backgroundColor: '#27ae60',
                    yAxisID: 'y2'
                }]
            },
            options: {
                responsive: true,
                interaction: {
                    mode: 'index',
                    intersect: false
                },
                stacked: false,
                plugins: {
                    legend: {
                        position: 'top'
                    },
                    title: {
                        display: true,
                        text: 'BMI & Life on Land Eco Actions Over Time'
                    }
                },
                scales: {
                    y1: {
                        type: 'linear',
                        position: 'left',
                        title: {
                            display: true,
                            text: 'BMI'
                        },
                        beginAtZero: true
                    },
                    y2: {
                        type: 'linear',
                        position: 'right',
                        title: {
                            display: true,
                            text: 'Eco Actions'
                        },
                        beginAtZero: true,
                        grid: {
                            drawOnChartArea: false
                        }
                    }
                }
            }
        });
    </script>

    <!-- AOS Library -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 1000,
            once: true
        });
    </script>
</body>

</html>
