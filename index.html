<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDG 15 - Page Title</title>

    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: url('https://miro.medium.com/v2/resize:fit:720/format:webp/1*jnsH3fTas6CL5EPc2HsJsg.png') no-repeat center center/cover;
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
            position: relative;
        }
        /* Overlay for readability */
        
        .overlay {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(3px);
            position: absolute;
            inset: 0;
            z-index: 0;
        }
        
        header {
            position: relative;
            text-align: center;
            padding: 80px 20px;
            z-index: 2;
        }
        
        h1 {
            font-size: 3rem;
            text-shadow: 0 0 25px #91ff9d;
        }
        
        p {
            font-size: 1.1rem;
            width: 70%;
            margin: auto;
            text-shadow: 0 0 10px #0f0;
        }
        
        nav {
            margin-top: 30px;
            z-index: 2;
        }
        
        nav a {
            color: #ffffff;
            padding: 12px 25px;
            text-decoration: none;
            border: 2px solid #c8ffc8;
            border-radius: 8px;
            margin: 0 10px;
            transition: 0.3s;
        }
        
        nav a:hover {
            background: #b5ffb5;
            color: #000;
            box-shadow: 0 0 20px #8cff8c;
        }
        /* Floating particles */
        
        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #aaffaa;
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
            opacity: 0.8;
            z-index: 1;
        }
        
        @keyframes float {
            0% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-60px) scale(1.3);
            }
            100% {
                transform: translateY(0) scale(1);
            }
        }
        
        section {
            position: relative;
            z-index: 2;
            padding: 20px;
            margin: 20px auto;
            max-width: 900px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
        }
        
        button,
        .btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }
        
        button:hover,
        .btn:hover {
            background: #27ae60;
        }
        
        table,
        th,
        td {
            border: 1px solid #fff;
            padding: 10px;
            text-align: center;
            width: 100%;
            border-collapse: collapse;
        }
    </style>
</head>

<body>

    <div class="overlay"></div>

    <!-- Floating particles -->
    <div class="particle" style="top: 85%; left: 20%; animation-delay: 0s;"></div>
    <div class="particle" style="top: 60%; left: 50%; animation-delay: 1s;"></div>
    <div class="particle" style="top: 70%; left: 80%; animation-delay: 2s;"></div>
    <div class="particle" style="top: 40%; left: 30%; animation-delay: 3s;"></div>
    <div class="particle" style="top: 50%; left: 10%; animation-delay: 4s;"></div>

    <header>
        <h1 data-aos="fade-down">SDG 15: Life on Land</h1>
        <p data-aos="fade-up" data-aos-delay="300">
            Protect, restore, and promote sustainable use of terrestrial ecosystems.
        </p>

        <nav data-aos="zoom-in" data-aos-delay="500">
            <a href="index.html">Home</a>
            <a href="about-us.html">About Us</a>
        </nav>
    </header>

    <section data-aos="fade-up" data-aos-delay="600">
        <!-- Your page-specific content goes here -->
        <h2>Page Title</h2>
        <p>This is where your page content will be displayed.</p>
    </section>

    <!-- AOS Library -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 1000,
            once: true
        });
    </script>

</body>

</html>
